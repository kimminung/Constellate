<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="SF Pro Text, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0B0F1F; }
      .t { fill: #F4F6FB; font-size: 16px; }
      .ts { fill: #F4F6FB; font-size: 14px; }
      .tb { fill: #F4F6FB; font-size: 20px; font-weight: 600; }
      .th { fill: #F4F6FB; font-size: 26px; font-weight: 700; }
      .muted { fill: #8A93A6; font-size: 14px; }
      .lane { fill: #121733; stroke: #2A3150; stroke-width: 1.5; rx: 12; }
      .box { fill: #0E1220; stroke-width: 1.5; rx: 8; }
      .cyan { stroke: #5EE1FF; }
      .pink { stroke: #FF7AB6; }
      .amber { stroke: #FFD166; }
      .lime { stroke: #B8FF7A; }
      .lav { stroke: #B89CFF; }
      .grey { stroke: #8A93A6; }
      .halo { stroke: #9B8CFF; }
      .lbl-cyan { fill: #5EE1FF; font-size: 15px; font-weight: 600; }
      .lbl-pink { fill: #FF7AB6; font-size: 15px; font-weight: 600; }
      .lbl-amber { fill: #FFD166; font-size: 15px; font-weight: 600; }
      .lbl-lime { fill: #B8FF7A; font-size: 15px; font-weight: 600; }
      .lbl-lav { fill: #B89CFF; font-size: 15px; font-weight: 600; }
      .lbl-halo { fill: #9B8CFF; font-size: 15px; font-weight: 600; }
      .arrow { stroke: #6B7390; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7390"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="860"/>

  <text class="th" x="40" y="48">Constellate — 아키텍처</text>
  <text class="muted" x="40" y="72">단일 멀티플랫폼 앱 타깃 + 순수 Swift 패키지 ConstellateKit · 기본 MainActor 격리 · async/await (Combine 없음)</text>

  <!-- Platform columns -->
  <g>
    <rect class="box cyan" x="40" y="96" width="360" height="86"/>
    <text class="lbl-cyan" x="56" y="122">visionOS 27</text>
    <text class="ts" x="56" y="146">Dashboard 창 + Inspector 창</text>
    <text class="ts" x="56" y="168">ImmersiveSpace(progressive) · 시선+핀치 · 손 · 음성</text>

    <rect class="box cyan" x="420" y="96" width="360" height="86"/>
    <text class="lbl-cyan" x="436" y="122">iPadOS 27</text>
    <text class="ts" x="436" y="146">NavigationSplitView 3열</text>
    <text class="ts" x="436" y="168">창 안 RealityView + 궤도 카메라 · 터치 · 펜슬 · 음성</text>

    <rect class="box cyan" x="800" y="96" width="360" height="86"/>
    <text class="lbl-cyan" x="816" y="122">macOS 27</text>
    <text class="ts" x="816" y="146">3열 + 메뉴바 명령</text>
    <text class="ts" x="816" y="168">창 안 RealityView · 마우스 · 키보드 · 음성</text>
  </g>

  <path class="arrow" d="M600,182 L600,206"/>

  <!-- App layer lane -->
  <rect class="lane" x="40" y="210" width="1120" height="300"/>
  <text class="tb" x="56" y="238">Constellate 앱 (MainActor)</text>
  <text class="muted" x="330" y="238">Kit의 값 타입을 엔티티·뷰로 바꾼다. RealityKit·FoundationModels·Speech·GroupActivities는 여기에만 있다.</text>

  <!-- Row 1: SwiftUI scenes + Spatial -->
  <rect class="box cyan" x="56" y="254" width="320" height="110"/>
  <text class="lbl-cyan" x="70" y="278">SwiftUI Scenes / Views</text>
  <text class="ts" x="70" y="300">ConstellateApp · AppModel(@Observable)</text>
  <text class="ts" x="70" y="320">Dashboard · Navigator · Inspector · CodeCard</text>
  <text class="ts" x="70" y="340">HostChat · TimeDial · ThemePicker · TourBar</text>

  <rect class="box amber" x="392" y="254" width="420" height="110"/>
  <text class="lbl-amber" x="406" y="278">Spatial (RealityKit, 메인 전용)</text>
  <text class="ts" x="406" y="300">SceneController · CodeNodeEntity · MeshFactory</text>
  <text class="ts" x="406" y="320">EdgeRenderer(1500 캡) · OrbEntity · TextureFactory(400)</text>
  <text class="ts" x="406" y="340">Beacon · Avatar · EnvironmentEntity · AssetLoader</text>

  <rect class="box grey" x="828" y="254" width="316" height="110"/>
  <text class="lbl-cyan" x="842" y="278">Platform · Support · Resources</text>
  <text class="ts" x="842" y="300">OrbitCameraRig · ConstellationViewport</text>
  <text class="ts" x="842" y="320">ImmersiveView · HeadPoseProvider</text>
  <text class="ts" x="842" y="340">ScrollWheelMonitor · ColorBridge · 리소스</text>

  <!-- Row 2: AI / Voice / Session -->
  <rect class="box halo" x="56" y="382" width="376" height="112"/>
  <text class="lbl-halo" x="70" y="406">AI — 호스트 AI (방장 기기만)</text>
  <text class="ts" x="70" y="428">HostAI(LanguageModelSession · prewarm · 복구)</text>
  <text class="ts" x="70" y="448">Tools: LocateCode · ExplainNode · SummarizeCluster</text>
  <text class="ts" x="70" y="468">ReviewNode · PlanTour · LocateAnswer · HeuristicHost</text>

  <rect class="box pink" x="448" y="382" width="312" height="112"/>
  <text class="lbl-pink" x="462" y="406">Voice — 음성 출두</text>
  <text class="ts" x="462" y="428">SpeechListener (SpeechAnalyzer 스트림)</text>
  <text class="ts" x="462" y="448">웨이크워드 "Constellate" / "콘스텔"</text>
  <text class="ts" x="462" y="468">VoiceCommandRouter · HostChat 텍스트 폴백</text>

  <rect class="box lime" x="776" y="382" width="368" height="112"/>
  <text class="lbl-lime" x="790" y="406">Session — 회의 (GroupActivities)</text>
  <text class="ts" x="790" y="428">ConstellateActivity · SessionCoordinator</text>
  <text class="ts" x="790" y="448">GroupSessionMessenger JSON · "ask:" 규약</text>
  <text class="ts" x="790" y="468">roster · pin · tour · followHost · 시뮬레이션 멤버</text>

  <path class="arrow" d="M600,510 L600,534"/>

  <!-- Kit lane -->
  <rect class="lane" x="40" y="538" width="1120" height="170"/>
  <text class="tb" x="56" y="566">ConstellateKit — 순수 Swift 패키지 (Foundation + simd)</text>
  <text class="muted" x="640" y="566">플랫폼·UI를 모른다. 값 타입 + Sendable. swift test로 검증.</text>

  <rect class="box lav" x="56" y="582" width="200" height="104"/>
  <text class="lbl-lav" x="70" y="606">Graph</text>
  <text class="ts" x="70" y="628">CodeGraph · CodeNode</text>
  <text class="ts" x="70" y="648">CodeEdge · NodeKind</text>
  <text class="ts" x="70" y="668">Layer · +Analysis(Stats)</text>

  <rect class="box lav" x="268" y="582" width="200" height="104"/>
  <text class="lbl-lav" x="282" y="606">Ingest</text>
  <text class="ts" x="282" y="628">ProjectIngestor</text>
  <text class="ts" x="282" y="648">IngestOptions</text>
  <text class="ts" x="282" y="668">SwiftSymbolExtractor</text>

  <rect class="box lav" x="480" y="582" width="220" height="104"/>
  <text class="lbl-lav" x="494" y="606">Layout</text>
  <text class="ts" x="494" y="628">ConstellationLayoutEngine</text>
  <text class="ts" x="494" y="648">LayoutConfiguration</text>
  <text class="ts" x="494" y="668">ConstellationLayout · 4D→3D</text>

  <rect class="box lav" x="712" y="582" width="200" height="104"/>
  <text class="lbl-lav" x="726" y="606">Cluster · Search · Tour</text>
  <text class="ts" x="726" y="628">ClusterBuilder · CodeCluster</text>
  <text class="ts" x="726" y="648">CodeSearcher</text>
  <text class="ts" x="726" y="668">TourBuilder</text>

  <rect class="box lav" x="924" y="582" width="220" height="104"/>
  <text class="lbl-lav" x="938" y="606">Theme · Session · Sample</text>
  <text class="ts" x="938" y="628">ConstellateTheme.validate()</text>
  <text class="ts" x="938" y="648">ConstellateMessage · ReviewPin</text>
  <text class="ts" x="938" y="668">Participant · SampleGraph</text>

  <path class="arrow" d="M600,708 L600,732"/>

  <!-- Apple frameworks -->
  <rect class="lane" x="40" y="736" width="1120" height="96"/>
  <text class="tb" x="56" y="764">Apple 프레임워크</text>
  <g class="ts">
    <text x="56" y="794">SwiftUI</text>
    <text x="150" y="794">RealityKit</text>
    <text x="260" y="794">FoundationModels (온디바이스)</text>
    <text x="520" y="794">Speech / SpeechAnalyzer</text>
    <text x="740" y="794">AVFoundation</text>
    <text x="870" y="794">GroupActivities</text>
    <text x="1010" y="794">ARKit (visionOS)</text>
    <text x="56" y="818">Foundation · simd · os.Logger · UniformTypeIdentifiers · CoreText(글리프 아틀라스)</text>
  </g>
</svg>
